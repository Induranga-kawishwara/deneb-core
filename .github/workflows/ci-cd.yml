name: Publish DENEB UI Packages to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - all
          - '@deneb-ui/core'
          - '@deneb-ui/ui'
          - '@deneb-ui/cli'
          - '@deneb-ui/create-template'
        default: 'all'
      dry_run:
        description: 'Dry run only (validates package without uploading to registry)'
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build, Validate & Publish
    if: github.repository == 'deneb-ui/core'
    runs-on: ubuntu-latest
    env:
      CAN_PUBLISH: ${{ github.repository == 'deneb-ui/core' }}

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Dynamic Auto-Version Bump & Build
        id: dynamic_bump
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run mode - skipping dynamic version bump."
            npm run build
            exit 0
          fi

          if [ "$CAN_PUBLISH" != "true" ]; then
            echo "Fork or non-canonical repo: build without bumping or publishing."
            npm run build
            exit 0
          fi

          node scripts/auto-version-bump.js
          NEW_VER=$(node -p "require('./packages/deneb-ui/package.json').version")
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_ENV
          echo "BUMPED=true" >> $GITHUB_ENV
          echo "✔ Dynamic version ready: v$NEW_VER"

      - name: Assert release lockstep
        run: node scripts/assert-release-lockstep.js

      - name: Test packages
        env:
          DENEB_SKIP_FONTS: '1'
        run: |
          npm test --workspace=@deneb-ui/core
          npm test --workspace=@deneb-ui/cli

      - name: Scaffold smoke test
        run: node scripts/smoke-create-template.js

      - name: Validate Template Compliance
        run: |
          cd templates/nextjs
          node ../../cli/deneb-cli/bin/index.js validate . --skip-install || echo "Preflight validation completed."

      - name: Skip npm publish on fork
        if: env.CAN_PUBLISH != 'true'
        run: |
          echo "This workflow ran on ${{ github.repository }}."
          echo "npm publish only runs on deneb-ui/core (org secrets + trusted publisher)."
          echo "Merge the PR into deneb-ui/core to release."

      - name: Configure npm registry auth
        if: env.CAN_PUBLISH == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          scope: '@deneb-ui'

      - name: Publish to npm Registry
        if: env.CAN_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DENEB_TOKEN || secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No DENEB_TOKEN / NPM_TOKEN. Removing empty auth so GitHub OIDC trusted publishing can work."
            if [ -f "$HOME/.npmrc" ]; then
              grep -v '_authToken' "$HOME/.npmrc" > "$HOME/.npmrc.noid" || true
              mv "$HOME/.npmrc.noid" "$HOME/.npmrc"
            fi
          fi

          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in DRY RUN mode (no actual upload to npm)"
          fi

          TARGET_PACKAGE="${{ github.event.inputs.package || 'all' }}"
          echo "Target package: $TARGET_PACKAGE"

          publish_pkg() {
            local dir=$1
            local name=$2
            cd "$GITHUB_WORKSPACE/$dir"
            local local_ver=$(node -p "require('./package.json').version")
            local is_published=$(npm view "$name@$local_ver" version --no-workspaces 2>/dev/null || echo "")

            echo "========================================================="
            echo "Checking $name (local: v$local_ver)"

            if [ -n "$is_published" ] && [ -z "$DRY_RUN_FLAG" ]; then
              echo "⏩ Skipping $name: v$local_ver is already published on npm."
              return 0
            fi

            echo "---------------------------------------------------------"
            echo "🚀 Publishing $name v$local_ver from $dir..."
            echo "---------------------------------------------------------"
            npm publish --access public --provenance $DRY_RUN_FLAG
          }

          if [ "$TARGET_PACKAGE" = "all" ] || [ "$TARGET_PACKAGE" = "@deneb-ui/core" ]; then
            publish_pkg "packages/deneb-core" "@deneb-ui/core"
          fi

          if [ "$TARGET_PACKAGE" = "all" ] || [ "$TARGET_PACKAGE" = "@deneb-ui/ui" ]; then
            publish_pkg "packages/deneb-ui" "@deneb-ui/ui"
          fi

          if [ "$TARGET_PACKAGE" = "all" ] || [ "$TARGET_PACKAGE" = "@deneb-ui/cli" ]; then
            publish_pkg "cli/deneb-cli" "@deneb-ui/cli"
          fi

          if [ "$TARGET_PACKAGE" = "all" ] || [ "$TARGET_PACKAGE" = "@deneb-ui/create-template" ]; then
            publish_pkg "packages/create-template" "@deneb-ui/create-template"
          fi

          echo "========================================================="
          echo "✔ All requested packages processed!"
          echo "========================================================="

      - name: Commit & Push Bumped Version Back to Repo
        if: env.CAN_PUBLISH == 'true' && env.BUMPED == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages cli/deneb-cli templates/nextjs
          git commit -m "chore(release): auto-bump packages to v${{ env.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push to main branch skipped or already up to date"

      - name: Trigger UI Showcase Synchronization
        if: env.CAN_PUBLISH == 'true' && env.BUMPED == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DENEB_ORG_SYNC_PAT || secrets.GITHUB_TOKEN }}
          repository: deneb-ui/ui
          event-type: core_package_published
          client-payload: '{"version": "${{ env.NEW_VERSION }}", "sha": "${{ github.sha }}", "actor": "${{ github.actor }}"}'
        continue-on-error: true

      - name: Verify npm lockstep
        if: >
          env.CAN_PUBLISH == 'true' &&
          env.BUMPED == 'true' &&
          github.event.inputs.dry_run != 'true' &&
          github.event.inputs.package != '@deneb-ui/core' &&
          github.event.inputs.package != '@deneb-ui/ui' &&
          github.event.inputs.package != '@deneb-ui/cli' &&
          github.event.inputs.package != '@deneb-ui/create-template'
        run: node scripts/verify-npm-lockstep.js "${{ env.NEW_VERSION }}"
